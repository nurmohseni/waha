services:
  waha:
    restart: always
    image: devlikeapro/waha:latest
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    # --- REMOVED 'ports' ---
    # Dokploy will manage this based on your UI settings.

    volumes:
      # --- REMOVED './sessions' ---
      # This conflicts with the Postgres database.

      # This one is for media, which is fine, but
      # we are using Postgres for media now (see .env),
      # so you can safely remove it too.
      - './media:/app/.media'

    env_file:
      - .env # This now points to your file from Step 1

    # This is crucial: It waits for Postgres to be ready
    # before starting WAHA.
    depends_on:
      - postgres

  postgres:
    image: postgres:17.6
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # This is fine, it doesn't interfere with Dokploy
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - '-c'
      - 'max_connections=3000'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

volumes:
  # These are not used, but fine to leave
  mongodb_data: {}
  minio_data: {}
  # This is used by your postgres service
  pg_data: {}
