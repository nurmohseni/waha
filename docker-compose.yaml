# https://waha.devlike.pro/docs/how-to/install/
services:
  waha:
    restart: always
    image: devlikeapro/waha:latest
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

    # REMOVED the 'ports' section. Dokploy will manage this.

    volumes:
      # REMOVED the conflicting './sessions' volume.
      # We are using Postgres instead.

      # Save media files (This one is fine to keep)
      - './media:/app/.media'

    env_file:
      - .env

    # This is important! It waits for Postgres to be ready.
    depends_on:
      - postgres

  postgres:
    image: postgres:17.6 # The documentation uses postgres:17, 17.6 is fine.
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      # This port is fine, it's only for your local server access.
      - '127.0.0.1:5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - postgres
      - '-c'
      - 'max_connections=3000'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '10'

volumes:
  mongodb_data: {}
  minio_data: {}
  pg_data: {}
